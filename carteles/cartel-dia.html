<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Cartel · Sindicato Progresa</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="cartel.css" rel="stylesheet">
<link href="cartel-dia.css" rel="stylesheet">
</head>
<body>
<!-- Un mismo diseño para todos los carteles:
       cartel-dia.html?id=8m                 → días importantes (js/carteles.js)
       cartel-dia.html?festivo=2026-12-08    → festivos (js/calendario.js)
       cartel-dia.html?editor=1              → vista previa de la herramienta crear-cartel.html -->
<div class="poster dia" id="cartel">
    <i class="bi bg-icon" id="bg-icon"></i>

    <header class="d-top">
        <div class="d-brand">
            <div class="logo"><img src="../img/logo.jpg" alt="Sindicato Progresa"></div>
            <span>SINDICATO<br>PROGRESA</span>
        </div>
        <div class="d-date" id="fecha"></div>
    </header>

    <div class="d-mid" id="mid">
        <main class="d-main">
            <div class="d-siglas" id="siglas"></div>
            <div class="d-nombre" id="nombre"></div>
            <div class="d-lema" id="lema"></div>
        </main>

        <div class="d-foto" id="foto-caja" hidden><img id="foto" alt=""></div>

        <section class="d-card" id="card">
            <h2 id="titulo-derechos">Tus derechos</h2>
            <div id="derechos"></div>
        </section>
    </div>

    <footer class="d-foot p-foot">
        <div class="d-call" id="llamada-caja">
            <strong id="llamada"></strong>
            <div class="d-contact" id="contacto">
                <span><i class="bi bi-whatsapp"></i> 685 049 357</span>
                <span><i class="bi bi-envelope"></i> s.gral@sindicato-progresa.com</span>
            </div>
        </div>
        <div class="arcoiris" id="franja"></div>
        <div class="legal">
            <span>SINDICATO PROGRESA · Organización sindical estatal, plural, democrática y autónoma · sindicato-progresa.com</span>
            <span id="legal-der">Información orientativa</span>
        </div>
    </footer>
</div>

<script src="../js/calendario.js"></script>
<script src="../js/carteles.js"></script>
<script>
/* Pinta el cartel a partir de un objeto con sus textos y colores.
   La herramienta crear-cartel.html la llama con lo que escriben en el formulario. */
function pintarCartel(d) {
    const $ = id => document.getElementById(id);
    const r = document.documentElement.style;
    r.setProperty('--c1', d.color);
    r.setProperty('--c2', d.color2 || d.color);
    r.setProperty('--acento', d.acento || '#FFC914');

    document.title = `Cartel ${d.nombre || ''} · Sindicato Progresa`;
    $('fecha').textContent = d.fechaTexto || '';
    $('fecha').hidden = !d.fechaTexto;

    const siglas = $('siglas');
    siglas.innerHTML = d.siglasHtml || '';
    siglas.hidden = !d.siglasHtml;
    siglas.classList.toggle('largo', (d.siglas || '').length > 3);
    siglas.style.fontSize = '';

    $('nombre').textContent = d.nombre || '';
    $('nombre').hidden = !d.nombre;
    $('lema').innerHTML = d.lema || '';
    $('lema').hidden = !d.lema;
    $('lema').style.fontSize = '';

    $('bg-icon').className = 'bi bg-icon ' + (d.icono || '');

    $('foto-caja').hidden = !d.imagen;
    if (d.imagen) $('foto').src = d.imagen;

    const puntos = (d.derechos || []).filter(p => p[1]);
    $('card').hidden = !puntos.length;
    $('titulo-derechos').textContent = d.tituloDerechos || '';
    $('titulo-derechos').hidden = !d.tituloDerechos;
    $('derechos').innerHTML = puntos
        .map(([ico, txt]) => `<div class="d-item"><i class="bi ${ico}"></i><div>${txt}</div></div>`).join('');
    $('derechos').style.fontSize = '';

    $('llamada').textContent = d.llamada || '';
    $('llamada').hidden = !d.llamada;
    $('llamada-caja').classList.toggle('fuerte', !!d.llamadaFuerte);
    $('contacto').hidden = d.contacto === false;
    $('legal-der').textContent = d.legal ?? 'Información orientativa';

    const franja = $('franja');
    const colores = d.arcoiris
        ? ['#E40303', '#FF8C00', '#FFED00', '#008026', '#004DFF', '#750787']
        : ['#1E56D9', '#FFC914', '#E3262E', '#7BC425'];
    franja.innerHTML = colores.map(c => `<span style="background:${c}"></span>`).join('');
    franja.style.height = d.arcoiris ? '' : '3.2mm';

    ajustar();
}

/* Si el texto es largo, reduce las letras hasta que todo quepa en el cartel */
function ajustar() {
    const $ = id => document.getElementById(id);
    const siglas = $('siglas'), lema = $('lema'), puntos = $('derechos'), mid = $('mid');
    let t = parseFloat(getComputedStyle(siglas).fontSize);
    while (siglas.scrollWidth > siglas.clientWidth + 1 && t > 40) { t -= 4; siglas.style.fontSize = t + 'px'; }

    let l = parseFloat(getComputedStyle(lema).fontSize);
    let p = parseFloat(getComputedStyle(puntos).fontSize) || 25;
    let s = parseFloat(getComputedStyle(siglas).fontSize);
    const sobra = () => mid.scrollHeight > mid.clientHeight + 1;
    for (let i = 0; i < 40 && sobra(); i++) {
        if (s > 90) { s *= .92; siglas.style.fontSize = s + 'px'; }
        if (l > 34) { l *= .94; lema.style.fontSize = l + 'px'; }
        if (p > 17) { p *= .95; puntos.style.fontSize = p + 'px'; }
    }
    document.body.dataset.cabe = sobra() ? 'no' : 'si';
}

(function () {
    const q = new URLSearchParams(location.search);
    if (q.get('editor')) return;   // la herramienta manda los datos ella misma

    let d;
    if (q.get('festivo')) {
        // ---- Cartel de festivo, a partir del calendario laboral ----
        const fecha = q.get('festivo');
        const anio = Number(fecha.slice(0, 4));
        const f = FESTIVOS[anio].dias.find(x => x.fecha === fecha);
        const [, m, dd] = fecha.split('-').map(Number);
        const COLORES = {
            nacional:   ['#E3262E', '#A3161C', 'Es festivo en <b>toda España</b>.'],
            autonomico: ['#1E56D9', '#0B1F4D', 'Es festivo en <b>toda la Comunidad de Madrid</b>.'],
            local:      ['#3F8A12', '#25560A', 'Es festivo local de <b>Madrid capital</b>: cuenta el municipio donde está tu centro de trabajo.']
        };
        const [c1, c2, donde] = COLORES[f.tipo];
        d = {
            fechaTexto: `${DIAS_SEMANA[new Date(anio, m - 1, dd).getDay()]} ${dd} de ${MESES_CARTEL[m - 1]}`,
            siglasHtml: `${dd}<small>${MESES_CARTEL[m - 1].toUpperCase()}</small>`,
            nombre: f.nombre,
            lema: 'Día festivo,<br>pagado y no recuperable',
            color: c1, color2: c2, acento: '#FFC914', icono: 'bi-calendar-heart',
            tituloDerechos: 'Lo que tienes que saber',
            derechos: [
                ['bi-cash-coin',     'Es un día <b>pagado</b> y no tienes que recuperarlo.'],
                ['bi-arrow-repeat',  'Si te toca trabajar, tu empresa debe <b>compensártelo</b> con descanso o pagártelo según tu convenio.'],
                ['bi-geo-alt',       donde]
            ],
            llamada: '¿No te respetan los festivos? Te asesoramos.'
        };
    } else {
        // ---- Cartel de día importante ----
        const x = DIAS_IMPORTANTES.find(y => y.id === q.get('id')) || DIAS_IMPORTANTES[0];
        d = { ...x,
            fechaTexto: `${x.dia} de ${MESES_CARTEL[x.mes - 1]}`,
            siglasHtml: x.siglas,
            tituloDerechos: 'Tus derechos'
        };
    }
    // Esperar a las fuentes para medir bien al ajustar
    document.fonts.ready.then(() => pintarCartel(d));
})();
</script>
</body>
</html>
